<style>
:root{
  --bg:#F3F2EC; --surface:#FFFFFF; --ink:#17211B; --muted:#56605A; --line:#DAD8CF; --line2:#ECEAE3;
  --green:#1D6B3C; --green-d:#14502C; --green-soft:#E3EFE6; --green-bright:#4FB06D;
  --orange:#B4500A; --orange-d:#6B2F05; --orange-soft:#FBEBDD;
  --red:#A3261B; --red-d:#6E160F; --red-soft:#F6DCD8;
  --dark:#17211B; --dark2:#24342A; --dark3:#2F4637; --on-dark-muted:#C3CEC6;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
header.top{background:var(--dark);color:#F3F2EC;position:sticky;top:0;z-index:10}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{font-weight:800;font-size:16px;letter-spacing:.02em}
.brand span{color:var(--on-dark-muted);font-weight:600}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;font-size:14px;font-weight:600}
nav.tabs a{color:var(--on-dark-muted);text-decoration:none;padding:9px 12px;border-radius:6px;min-height:40px;display:flex;align-items:center}
nav.tabs a.on{background:var(--dark3);color:#fff}
.who{margin-left:auto;font-size:13px;color:var(--on-dark-muted);display:flex;gap:10px;align-items:center}
.who button{background:transparent;border:1px solid var(--dark3);color:#F3F2EC;border-radius:6px;padding:6px 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15}
h2{margin:0;font-size:16px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.dark{background:var(--dark);color:#F3F2EC;border-color:var(--dark)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.grow{flex:999 1 520px;min-width:0}
.side{flex:1 1 300px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid #C9C7BE;background:#fff;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.bright{background:var(--green-bright);border-color:var(--green-bright);color:#0F1A13}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.block{width:100%;min-height:54px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{min-height:44px;border:1px solid #C9C7BE;border-radius:8px;padding:0 12px;font-size:16px;color:var(--ink);background:#fff;font-weight:400}
label.f textarea{padding:10px 12px;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:8px}
.seg button{min-height:38px;padding:0 12px;border-radius:6px;border:none;background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--dark);color:#fff}
.holes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.hole{min-height:58px;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;background:#fff;border:2px solid var(--line);cursor:pointer}
.hole b{font-size:15px}
.hole span{font-family:var(--mono);font-size:12px}
.hole.on{background:var(--green);border-color:var(--green);color:#fff}
.hole:disabled{background:var(--bg);color:#8A928C;border:1px dashed #C9C7BE;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green-d)}
.b-warn{background:var(--orange-soft);color:var(--orange-d)}
.b-alert{background:var(--red-soft);color:var(--red-d)}
.b-neutral{background:var(--bg);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border-radius:12px;padding:14px 16px;background:#fff;border:1px solid var(--line)}
.kpi .v{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.dark{background:var(--dark);color:#F3F2EC;border-color:var(--dark)}
.kpi.dark .l{color:var(--on-dark-muted)}
.kpi.warn{background:var(--orange-soft);border-color:#F0CFAF;color:var(--orange-d)}
.kpi.warn .l{color:var(--orange-d)}
.kpi.alert{background:var(--red-soft);border-color:#E8B5AE;color:var(--red-d)}
.kpi.alert .l{color:var(--red-d)}
.area-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;border-radius:10px;cursor:pointer;background:#fff;border:2px solid var(--line);text-align:left}
.area-btn.on{background:var(--green-soft);border-color:var(--green)}
.chk{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #8A928C;background:#fff}
.area-btn.on .chk{background:var(--green);border-color:var(--green)}
.yn{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn button{min-width:54px;min-height:44px;border:none;font-weight:700;background:#fff;color:var(--muted);cursor:pointer}
.yn button.y.on{background:var(--green);color:#fff}
.yn button.n.on{background:var(--orange);color:#fff}
.reasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.reasons button{min-height:46px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;border:2px solid var(--line);padding:4px 8px}
.reasons button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.bar{position:relative;height:14px;background:var(--line2);border-radius:4px}
.bar > i{position:absolute;left:0;top:0;height:14px;border-radius:4px;display:block}
.bar > em{position:absolute;top:-4px;height:22px;width:2px;background:var(--ink)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mini{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.mini div{aspect-ratio:1/1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.mini div span{font-family:var(--mono);font-size:14px}
.note{border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.4}
.note.warn{background:var(--orange-soft);color:var(--orange-d)}
.note.alert{background:var(--red-soft);color:var(--red-d)}
.note.ok{background:var(--green-soft);color:var(--green-d)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.list-item:first-child{border-top:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600}
.chip button{border:none;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1}
.tank{display:grid;grid-template-columns:1.5fr repeat(var(--cols),1fr);gap:6px 8px;font-size:14px;align-items:baseline}
.tank .h{font-size:12px;color:var(--muted);font-weight:600}
.tank .n{text-align:right;font-family:var(--mono)}
.paso{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--ink);color:#fff;font-family:var(--mono);font-weight:600;font-size:15px}
.area-btn.on .paso{background:var(--green-d)}
.hole-n{position:absolute;top:4px;right:6px;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;background:#fff;color:var(--green-d);border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.seq li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.seq li:first-child{border-top:0}
.seq-t{flex:1 1 auto;min-width:0}
.seq .btn.sm{min-width:44px;min-height:44px;padding:0}
.tq-now{border:2px solid var(--green);background:var(--green-soft)}
.tq{border-top:1px solid var(--line2);padding-top:10px}
.tq:first-of-type{border-top:0}
.tq-l{margin:6px 0 0;padding-left:22px}
.tq-l li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.tchips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.tc{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--tb);color:var(--tf)}
.tc::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tf)}
.t-foliar{--tb:#E3EFE6;--tf:#14502C}.t-fungicida{--tb:#ECE5F5;--tf:#4B2A7A}.t-herbicida{--tb:#FBEBDD;--tf:#6B2F05}
.t-insecticida{--tb:#F6DCD8;--tf:#6E160F}.t-humectante{--tb:#DDEBF5;--tf:#1C4A6E}.t-nematicida{--tb:#EFE9D9;--tf:#5A4A1C}
.tsel{display:flex;flex-wrap:wrap;gap:8px}
.tsel button{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.tsel button.on{background:var(--tb);border-color:var(--tf);color:var(--tf)}
.tsel button.on::before{content:'✓ '}
.tkpi{cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tkpi.on{border:2px solid var(--tf);background:var(--tb)}
.tmat{border-collapse:separate;border-spacing:4px;width:100%}
.tmat th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:2px}
.tmat th:first-child{text-align:left}
.tmat td{text-align:center;font-family:var(--mono);font-size:14px;padding:8px 4px;border-radius:6px;background:var(--bg)}
.tmat td:first-child{text-align:left;background:transparent;font-family:inherit;padding-left:0}
.tmat td.d1{background:var(--green-soft);color:var(--green-d)}.tmat td.d2{background:#F4F0DC;color:#5A4A1C}.tmat td.d3{background:var(--orange-soft);color:var(--orange-d)}
.tq-l li::marker{font-family:var(--mono);color:var(--muted)}
.rec{border:2px solid var(--green);border-radius:10px;overflow:hidden}
.rec-h{background:var(--green-soft);color:var(--green-d);padding:8px 12px;font-size:14px}
.rec-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 12px;border-top:1px solid var(--line2)}
.rec-p{font-weight:600}
.rec-q{font-size:22px;font-weight:700;white-space:nowrap}
.note:not(.warn):not(.alert):not(.ok){background:var(--bg)}
.opbar{background:var(--dark);color:#F3F2EC;padding:18px 16px;border-radius:12px;display:flex;flex-direction:column;gap:8px}
.pill{background:var(--dark2);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600}
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.progress i{display:block;height:10px;background:var(--green)}
@media (max-width:600px){h1{font-size:22px}.mini{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>

function tituloOrden(o) { return (o.titulo && String(o.titulo).trim()) || resumenAreas(o.areas) || 'Orden ' + num(o.id); }
var ML_POR_OZ = 29.5735;
function esMlOz(p) { return !!(p && p.mostrar_ml_oz); }
// cantidad guardada en kg o L → texto para mostrar; los productos marcados salen en mL y oz
function cant(p, v, porHa) {
  var suf = porHa ? '/ha' : '';
  if (v == null || isNaN(v)) return '—';
  if (esMlOz(p)) { var ml = Number(v) * 1000; return nq(ml < 10 ? Math.round(ml * 10) / 10 : Math.round(ml)) + ' mL' + suf + ' · ' + nq(Math.round(ml / ML_POR_OZ * 10) / 10) + ' oz' + suf; }
  return nq(v) + ' ' + (p ? p.unidad_dosis : '') + suf;
}
// para los marcados, el formulario se escribe en mL u oz y se guarda en L
function aLitros(p, valor, u) { var x = Number(valor); if (!esMlOz(p) || !(x > 0)) return valor; return u === 'oz' ? x * ML_POR_OZ / 1000 : x / 1000; }
function deLitros(p, litros, u) { var x = Number(litros); if (!esMlOz(p) || !(x > 0)) return litros; var r = u === 'oz' ? x * 1000 / ML_POR_OZ : x * 1000; return Math.round(r * 100) / 100; }
// búsqueda de órdenes: cada palabra debe aparecer en título, número, fecha, operador, sprayer, productos o áreas
function sinTildes(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function buscarOrdenes(ords, texto) {
  var tk = sinTildes(texto).replace(/[.,;:]/g, ' ').split(/\s+/).filter(Boolean);
  if (!tk.length) return { items: ords.slice(0, 8), total: ords.length };
  // "rough 7", "green 19", "16 oct" se buscan juntos; un número suelto se busca como número completo (7 no encuentra 17)
  var esc2 = function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  var terms = [];
  for (var i = 0; i < tk.length; i++) {
    var a = tk[i], b = tk[i + 1], na = /^\d+$/.test(a), nb = b != null && /^\d+$/.test(b);
    if (b != null && na !== nb) { terms.push(new RegExp('(^|[^0-9a-z])' + esc2(a + ' ' + b) + '($|[^0-9a-z])')); i++; }
    else terms.push(na ? new RegExp('(^|[^0-9])' + a + '($|[^0-9])') : new RegExp(esc2(a)));
  }
  var palabras = terms;
  var r = ords.filter(function (o) {
    if (!o._txt) o._txt = sinTildes([o.titulo, num(o.id), o.fecha, fecha(o.fecha), perfilNombre(o.operador_id), (byId(S.cat.sprayers, o.sprayer_id) || {}).nombre, o.notas,
      (o.productos || []).map(function (x) { var p = byId(S.cat.productos, x.producto_id); return p ? p.nombre : ''; }).join(' '),
      (o.areas || []).map(function (a) { return areaNombre(a) + ' / hoyo ' + a.unidad_id + ' / ' + zonaNombre(a.zona_id) + ' ' + a.unidad_id; }).join(' / ')].join(' | '));
    return palabras.every(function (w) { return w.test(o._txt); });
  });
  return { items: r.slice(0, 20), total: r.length };
}
function prod(id) { return byId(S.cat.productos, id); }
function invUnidad(p) { return p.unidad_inventario === 'galon' ? 'gal' : p.unidad_inventario === 'saco' ? 'sacos' : p.unidad_inventario; }
function cumplBadge(ok, tot) { if (!tot) return '<span class="badge b-neutral">—</span>'; return '<span class="badge ' + (ok === tot ? 'b-ok' : 'b-warn') + ' mono">' + ok + '/' + tot + '</span>'; }

// cálculo de mezcla: la receta es por tanque (cantidad total de cada producto en un tanque de X L);
// la dosis por hectárea es solo un equivalente derivado (cantidad × calibración ÷ agua del tanque)
function porTanqueDe(x, cal, aguaT) {
  if (x.cantidad_tanque != null && x.cantidad_tanque !== '' && Number(x.cantidad_tanque) > 0) return Number(x.cantidad_tanque);
  return cal > 0 && aguaT > 0 && Number(x.dosis_por_ha) > 0 ? Number(x.dosis_por_ha) * aguaT / cal : 0;
}
function calcular(areas, productos, calLha, aguaTanque, capL) {
  var m2 = 0; areas.forEach(function (a) { if (a.m2) m2 += Number(a.m2); });
  var ha = m2 / 10000; var cal = Number(calLha) || 0; var aguaT = Number(aguaTanque) || Number(capL) || 0;
  var agua = ha * cal;
  var llenos = aguaT > 0 ? Math.floor(agua / aguaT + 1e-9) : 0;
  var resto = aguaT > 0 ? Math.max(0, agua - llenos * aguaT) : 0;
  if (resto < 1) resto = 0;
  var lineas = productos.filter(function (x) { return x.producto_id && (Number(x.cantidad_tanque) > 0 || Number(x.dosis_por_ha) > 0); }).map(function (x) {
    var p = prod(x.producto_id); var pt = porTanqueDe(x, cal, aguaT);
    var d = cal > 0 && aguaT > 0 && pt > 0 ? pt * cal / aguaT : Number(x.dosis_por_ha) || 0;
    return { p: p, porTanque: pt, dosis: d, total: ha * d, resto: aguaT > 0 ? pt * resto / aguaT : 0 };
  });
  return { m2: m2, ha: ha, agua: agua, aguaT: aguaT, cal: cal, llenos: llenos, resto: resto, lineas: lineas };
}
function tanquesTxt(c) {
  if (!c.aguaT || !c.cal || !c.ha) return '—';
  var t = c.llenos + (c.resto ? 1 : 0);
  return t + (t === 1 ? ' tanque' : ' tanques') + (c.resto ? ' (último de ' + n(c.resto) + ' L)' : '');
}

async function cargarCatalogos() {
  var r = await Promise.all([
    q(sb.from('smgc_apl_unidades').select('*').order('orden')),
    q(sb.from('smgc_apl_zonas').select('*').order('orden')),
    q(sb.from('smgc_apl_areas').select('*')),
    q(sb.from('smgc_apl_sprayers').select('*').order('nombre')),
    q(sb.from('smgc_apl_boquillas').select('*').order('nombre')),
    q(sb.from('smgc_apl_productos').select('*').order('nombre')),
    q(sb.from('smgc_apl_perfiles').select('*').order('nombre')),
    q(sb.from('smgc_apl_ordenes').select('id, codigo'))
  ]);
  S.cat = { unidades: r[0], zonas: r[1], areas: r[2], sprayers: r[3], boquillas: r[4], productos: r[5], perfiles: r[6] };
}
async function inventario() { return q(sb.from('smgc_apl_inventario').select('*').order('nombre')); }
var ORDEN_SEL = '*, areas:smgc_apl_orden_areas(*), productos:smgc_apl_orden_productos(*)';

// ---------- arranque y sesión ----------
async function init() {
  var r = await sb.auth.getSession();
  S.session = r.data.session;
  sb.auth.onAuthStateChange(function (_e, s) { S.session = s; });
  if (!S.session) return renderLogin();
  await entrar();
}
async function entrar() {
  try {
    var uid = S.session.user.id;
    var p = await q(sb.from('smgc_apl_perfiles').select('*').eq('user_id', uid).maybeSingle());
    if (!p || !p.activo) { await sb.auth.signOut(); return renderLogin('Este usuario no tiene acceso a Aplicaciones.'); }
    S.perfil = p;
    await cargarCatalogos();
    if (!location.hash || location.hash === '#/') location.hash = inicio();
    route();
  } catch (e) { fail(e); renderLogin(); }
}
function inicio() { return S.perfil.rol === 'operador' ? '#/hoy' : S.perfil.rol === 'superintendente' ? '#/ordenes' : '#/cumplimiento'; }

function renderLogin(msg) {
  S.pintada = null;
  document.getElementById('app').innerHTML =
    '<div class="login"><form class="card" id="loginForm" autocomplete="on">' +
    '<div><div class="small muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Santa María Golf Club</div><h1>Aplicaciones</h1></div>' +
    (msg ? '<div class="note alert">' + esc(msg) + '</div>' : '') +
    '<label class="f">Usuario<input name="u" autocapitalize="none" autocorrect="off" autocomplete="username" required></label>' +
    '<label class="f">PIN de 4 dígitos<input name="p" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label>' +
    '<button class="btn primary block" type="submit">Entrar</button>' +
    '<div class="small muted">¿Olvidaste tu PIN? Pídeselo al administrador.</div></form></div>';
  document.getElementById('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var f = ev.target; var btn = f.querySelector('button'); btn.disabled = true;
    var u = f.u.value.trim().toLowerCase(); var email = u.indexOf('@') >= 0 ? u : u + '@' + USER_DOMAIN;
    var r = await sb.auth.signInWithPassword({ email: email, password: pinPassword(f.p.value) });
    if (r.error) { btn.disabled = false; return renderLogin('Usuario o PIN incorrecto.'); }
    S.session = r.data.session; await entrar();
  });
}

// ---------- estructura ----------
var NAV = {
  superintendente: [['#/ordenes', 'Órdenes'], ['#/nueva', 'Nueva orden'], ['#/cumplimiento', 'Cumplimiento'], ['#/tipos', 'Por tipo'], ['#/inventario', 'Inventario'], ['#/historial', 'Historial'], ['#/catalogos', 'Catálogos']],
  operador: [['#/hoy', 'Mis órdenes'], ['#/conteo', 'Conteo de inventario']],
  consulta: [['#/cumplimiento', 'Cumplimiento'], ['#/tipos', 'Por tipo'], ['#/inventario', 'Inventario'], ['#/historial', 'Historial']]
};
function shell(html) {
  var h = location.hash.split('/').slice(0, 2).join('/');
  var nav = NAV[S.perfil.rol].map(function (x) { return '<a href="' + x[0] + '" class="' + (h === x[0] ? 'on' : '') + '">' + x[1] + '</a>'; }).join('');
  // al redibujar la misma pantalla solo se cambia lo que cambió (sin parpadeo, sin perder el toque ni la posición);
  // al cambiar de pantalla se reemplaza todo y se sube arriba
  var mismo = S.pintada === location.hash, y = window.scrollY;
  var app = document.getElementById('app');
  var contenido = '<header class="top"><div class="top-in"><div class="brand">Aplicaciones <span>· SMGC</span></div><nav class="tabs">' + nav + '</nav>' +
    '<div class="who">' + esc(S.perfil.nombre) + '<button data-act="salir">Salir</button></div></div></header><main id="main">' + html + '</main>';
  if (mismo && window.morphdom && app.firstChild) {
    window.morphdom(app, '<div id="app">' + contenido + '</div>', {
      onBeforeElUpdated: function (desde, hacia) {
        // no tocar el campo donde la persona está escribiendo
        if (desde === document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(desde.tagName)) return false;
        return !desde.isEqualNode(hacia);
      }
    });
    if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
  } else {
    app.innerHTML = contenido;
    window.scrollTo(0, mismo ? y : 0);
  }
  S.pintada = location.hash;
}
function loading() { shell('<div class="empty">Cargando…</div>'); }

async function route() {
  if (!S.perfil) return;
  var parts = location.hash.replace(/^#\//, '').split('/');
  var v = parts[0], id = parts[1];
  var rol = S.perfil.rol;
  var allowed = NAV[rol].map(function (x) { return x[0].slice(2); });
  if (rol === 'superintendente') allowed.push('orden');
  if (rol === 'operador') allowed.push('orden', 'cierre');
  if (rol === 'consulta') allowed.push('orden');
  if (allowed.indexOf(v) < 0) { location.hash = inicio(); return; }
  S.view = v; if (S.pintada !== location.hash) loading();
  try {
    if (v === 'hoy') await vHoy();
    else if (v === 'orden') await vOrden(id);
    else if (v === 'cierre') await vCierre(id);
    else if (v === 'conteo') await vConteo();
    else if (v === 'ordenes') await vOrdenes();
    else if (v === 'nueva') await vNueva(id);
    else if (v === 'cumplimiento') await vCumplimiento(id);
    else if (v === 'inventario') await vInventario();
    else if (v === 'historial') await vHistorial();
    else if (v === 'tipos') await vTipos();
    else if (v === 'catalogos') await vCatalogos();
  } catch (e) { fail(e); shell('<div class="note alert">No se pudo cargar. ' + esc(e.message || '') + '</div>'); }
}
window.addEventListener('hashchange', route);

// ---------- detalle de orden (operador ejecuta / otros ven) ----------
function porSecuencia(areas) { return (areas || []).sort(function (a, b) { return ((a.secuencia || 9999) - (b.secuencia || 9999)) || (a.id - b.id); }); }
async function cargarOrden(id) { var o = await q(sb.from('smgc_apl_ordenes').select(ORDEN_SEL).eq('id', id).single()); if (o) porSecuencia(o.areas); return o; }
function htmlMezcla(o, calc) {
  if (!calc.lineas.length) return '<div class="small muted">Sin productos.</div>';
  var u = function (l) { return l.p ? l.p.unidad_dosis : ''; };
  var h = '';
  if (!calc.aguaT) {
    return h + '<div class="note warn">Esta orden no tiene agua por tanque, así que no se puede armar la receta.</div>' + calc.lineas.map(function (l) {
      return '<div class="between" style="border-top:1px solid var(--line2);padding-top:6px"><span>' + esc(l.p ? l.p.nombre : '?') + '</span><span class="mono">' + cant(l.p, l.dosis, true) + '</span></div>';
    }).join('');
  }
  h += '<div class="rec"><div class="rec-h"><span>Echa en cada tanque de <b class="mono">' + n(calc.aguaT) + ' L</b> de agua</span></div>';
  calc.lineas.forEach(function (l) {
    h += '<div class="rec-r"><span class="rec-p">' + esc(l.p ? l.p.nombre : '?') + '</span><span class="rec-q mono">' + cant(l.p, l.porTanque) + '</span></div>';
  });
  h += '</div>';
  if (calc.ha && calc.cal) {
    h += '<div class="between" style="gap:8px;flex-wrap:wrap"><span><b>Repite esta mezcla:</b> ' + (calc.llenos ? calc.llenos + (calc.llenos === 1 ? ' tanque lleno' : ' tanques llenos') : 'ningún tanque lleno') + '</span><span class="small muted mono">' + n(calc.agua) + ' L de agua en total</span></div>';
    if (calc.resto) h += '<details class="note"><summary>Último tanque más pequeño: <b class="mono">' + n(calc.resto) + ' L</b> de agua</summary>' + calc.lineas.map(function (l) { return '<div class="between" style="padding-top:4px"><span>' + esc(l.p ? l.p.nombre : '?') + '</span><b class="mono">' + cant(l.p, l.resto) + '</b></div>'; }).join('') + '</details>';
  }
  h += '<details class="small muted"><summary>Dosis equivalente por hectárea</summary>' + calc.lineas.map(function (l) { return esc(l.p ? l.p.nombre : '?') + ': <span class="mono">' + cant(l.p, l.dosis, true) + '</span>'; }).join('<br>') + (calc.cal ? '<br>Con calibración de ' + n(calc.cal) + ' L/ha.' : '') + '</details>';
  return h;
}
async function vOrden(id) {

    '<label class="f">Existencia actual<input name="inicial" type="number" step="any" min="0"></label>' +
    '</div><button class="btn primary" type="submit" style="align-self:flex-start">Agregar producto</button></form></div>';
  // usuarios
  html += '<div class="card"><h2>Usuarios</h2>' + S.cat.perfiles.map(function (p) { return '<div class="list-item"><div><b>' + esc(p.nombre) + '</b><div class="small muted">' + esc(p.rol) + '</div></div><span class="badge ' + (p.activo ? 'b-ok' : 'b-neutral') + '">' + (p.activo ? 'Activo' : 'Inactivo') + '</span></div>'; }).join('') +
    '<div class="small muted">Las cuentas nuevas y los cambios de PIN los hace el administrador.</div></div>';
  html += '<div class="card"><h2>Campo</h2><div class="small muted">' + S.cat.areas.length + ' áreas medidas en ' + S.cat.unidades.length + ' lugares. Las medidas vienen de la tabla del campo; para corregir alguna, pídelo al administrador.</div></div>';
  shell(html);
}
async function guardarCat(el) {
  var t = 'smgc_apl_' + el.dataset.t, f = el.dataset.f, v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
  else if (f === 'sprayer_id') v = el.value ? Number(el.value) : null;
  else v = el.value.trim();
  if (f === 'nombre' && !v) return toast('El nombre no puede quedar vacío', true);
  if (f === 'factor_conversion' && !(v > 0)) return toast('Debe ser mayor que cero', true);
  var patch = {}; patch[f] = v;
  if (t === 'smgc_apl_productos' && f === 'unidad_dosis') patch = v === 'mL' ? { unidad_dosis: 'L', mostrar_ml_oz: true } : { unidad_dosis: v, mostrar_ml_oz: false };
  try { await q(sb.from(t).update(patch).eq('id', Number(el.dataset.id))); await cargarCatalogos(); toast('Guardado'); } catch (e) { fail(e); }
}
async function enviarForm(form) {
  var k = form.dataset.form, fd = new FormData(form), o = {};
  fd.forEach(function (v, key) { o[key] = v; });
  function nn(v) { return v === '' || v == null ? null : Number(v); }
  try {
    if (k === 'sprayer') await q(sb.from('smgc_apl_sprayers').insert({ nombre: o.nombre.trim(), capacidad_l: nn(o.capacidad_l) }));
    if (k === 'boquilla') await q(sb.from('smgc_apl_boquillas').insert({ nombre: o.nombre.trim(), sprayer_id: nn(o.sprayer_id), calibracion_l_ha: nn(o.calibracion_l_ha) }));
    if (k === 'producto') {
      var p = await q(sb.from('smgc_apl_productos').insert({ nombre: o.nombre.trim(), tipo: o.tipo, unidad_dosis: o.unidad_dosis === 'mL' ? 'L' : o.unidad_dosis, mostrar_ml_oz: o.unidad_dosis === 'mL', unidad_inventario: o.unidad_inventario, factor_conversion: nn(o.factor_conversion) || 1, capacidad: nn(o.capacidad), minimo: nn(o.minimo) }).select().single());
      if (nn(o.inicial) > 0) await q(sb.from('smgc_apl_movimientos').insert({ producto_id: p.id, tipo: 'inicial', cantidad: nn(o.inicial), nota: 'Existencia al crear el producto' }));
    }
    toast('Agregado'); route();
  } catch (e) { fail(e); }
}

// ---------- eventos ----------
document.addEventListener('click', async function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act, d = S.draft;
  try {
    if (a === 'salir') { await sb.auth.signOut(); S.perfil = null; S.cat = null; location.hash = ''; renderLogin(); }
    else if (a === 'toggleArea') {
      el.disabled = true;
      var nuevo = el.dataset.estado === 'aplicada' ? 'pendiente' : 'aplicada';
      await q(sb.rpc('smgc_apl_confirmar_area', { p_id: Number(el.dataset.id), p_estado: nuevo, p_motivo: null, p_nota: null }));
      if (nuevo === 'aplicada' && el.dataset.tanque) await q(sb.rpc('smgc_apl_asignar_tanque', { p_id: Number(el.dataset.id), p_tanque: Number(el.dataset.tanque) }));
      route();
    }
    else if (a === 'tqCambiar') { S.tq = S.tq || {}; S.tq[el.dataset.id] = Math.max(1, Number(el.dataset.v)); route(); }
    else if (a === 'cierreTanque') { var st = S.cierre.areas[el.dataset.id]; st.tanque = st.tanque === Number(el.dataset.v) ? null : Number(el.dataset.v); renderCierre(); }
    else if (a === 'cierreSet') { var s = S.cierre.areas[el.dataset.id]; s.estado = el.dataset.v; if (s.estado === 'aplicada') s.motivo = null; renderCierre(); }
    else if (a === 'cierreMotivo') { S.cierre.areas[el.dataset.id].motivo = el.dataset.v; renderCierre(); }
    else if (a === 'confirmarCierre') await confirmarCierre(el);
    else if (a === 'cancelarOrden') { if (confirm('¿Cancelar esta orden? No se descuenta inventario.')) { await q(sb.from('smgc_apl_ordenes').update({ estado: 'cancelada' }).eq('id', Number(el.dataset.id))); toast('Orden cancelada'); route(); } }
    else if (a === 'dup') { var o = d.recientes.filter(function (x) { return String(x.id) === el.dataset.id; })[0]; duplicarEnDraft(o); renderNueva(); }
    else if (a === 'pend') {
      var p = d.pend.filter(function (x) { return String(x.orden_area_id) === el.dataset.id; })[0]; var k = p.unidad_id + '|' + p.zona_id;
      if (d.areas[k] && String(d.areas[k].arrastrada_de) === String(p.orden_area_id)) delete d.areas[k];
      else d.areas[k] = { unidad_id: p.unidad_id, zona_id: p.zona_id, arrastrada_de: p.orden_area_id };
      renderNueva();
    }
    else if (a === 'zona') { d.zona = el.dataset.v; renderNueva(); }
    else if (a === 'tipoApl') { var tv = el.dataset.v; d.tiposManual = true; d.tipos = d.tipos.indexOf(tv) >= 0 ? d.tipos.filter(function (x) { return x !== tv; }) : ordenTipos(d.tipos.concat([tv])); renderNueva(); }
    else if (a === 'tiposAuto') { d.tiposManual = false; renderNueva(); }
    else if (a === 'tipoSel') { S.tipoSel = S.tipoSel === el.dataset.v ? '' : el.dataset.v; await route(); var td = document.getElementById('tipoDet'); if (td && el.closest('.kpis')) td.scrollIntoView({ behavior: 'smooth' }); }
    else if (a === 'tipoDias') { S.tipoDias = Number(el.dataset.v); route(); }
    else if (a === 'hole') { var hk = el.dataset.u + '|' + d.zona; if (d.areas[hk]) delete d.areas[hk]; else d.areas[hk] = { unidad_id: el.dataset.u, zona_id: d.zona, arrastrada_de: null }; renderNueva(); }
    else if (a === 'addPunt') { var pk = d.puntUnidad + '|' + d.puntZona; d.areas[pk] = d.areas[pk] || { unidad_id: d.puntUnidad, zona_id: d.puntZona, arrastrada_de: null }; renderNueva(); }
    else if (a === 'seqMover' || a === 'seqOrdenar' || a === 'seqInvertir') {
      var ks = Object.keys(d.areas);
      if (a === 'seqMover') { var ix = ks.indexOf(el.dataset.k), j = ix + Number(el.dataset.d); if (ix >= 0 && j >= 0 && j < ks.length) { var tmp = ks[ix]; ks[ix] = ks[j]; ks[j] = tmp; } }
      else if (a === 'seqInvertir') ks.reverse();
      else { var ordU = S.cat.unidades.map(function (u) { return String(u.id); }), ordZ = S.cat.zonas.map(function (z) { return z.id; });
        ks.sort(function (x, y) { var X = x.split('|'), Y = y.split('|'); return (ordU.indexOf(X[0]) - ordU.indexOf(Y[0])) || (ordZ.indexOf(X[1]) - ordZ.indexOf(Y[1])); }); }
      var nu = {}; ks.forEach(function (k2) { nu[k2] = d.areas[k2]; }); d.areas = nu; renderNueva();
    }
    else if (a === 'rmArea') { delete d.areas[el.dataset.k]; renderNueva(); }
    else if (a === 'unidadCant') { d.productos[Number(el.dataset.i)].u = el.dataset.v; renderNueva(); }
    else if (a === 'addProd') { d.productos.push({ producto_id: '', cantidad_tanque: '' }); renderNueva(); }
    else if (a === 'rmProd') { d.productos.splice(Number(el.dataset.i), 1); if (!d.productos.length) d.productos.push({ producto_id: '', cantidad_tanque: '' }); renderNueva(); }
    else if (a === 'enviarOrden') await enviarOrden(el);
    else if (a === 'zonaMapa') { S.zonaMapa = el.dataset.v; route(); }
    else if (a === 'toggleCompra') { var cf = document.getElementById('compraForm'); cf.hidden = !cf.hidden; }
  } catch (err) { fail(err); el.disabled = false; }
});
document.addEventListener('input', function (e) {
  var el = e.target; if (el.dataset && (el.dataset.inp === 'titulo' || el.dataset.inp === 'notas') && S.draft) S.draft[el.dataset.inp] = el.value;
  if (el.dataset && el.dataset.inp === 'buscar' && S.draft) { S.draft.buscar = el.value; renderNueva(); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.classList && el.classList.contains('cat')) return guardarCat(el);
  var k = el.dataset && el.dataset.inp; if (!k) return;
  if (k === 'histU') { S.histU = el.value; return route(); }
  if (k === 'histZ') { S.histZ = el.value; return route(); }
  if (k === 'histT') { S.histT = el.value; return route(); }
  if (k === 'puntual') { S.cierre.puntual[el.dataset.key] = el.value; return; }
  var d = S.draft; if (!d) return;
  if (k === 'titulo') { d.titulo = el.value; if (!d.tiposManual) renderNueva(); return; }
  if (k === 'notas' || k === 'buscar') { d[k] = el.value; return; }
  if (k === 'prod') d.productos[Number(el.dataset.i)].producto_id = el.value;
  else if (k === 'cant') { var xc = d.productos[Number(el.dataset.i)]; xc.cantidad_tanque = aLitros(prod(xc.producto_id), el.value, xc.u); }
  else if (k === 'boquilla_id') { d.boquilla_id = el.value; var b = byId(S.cat.boquillas, el.value); if (b && b.calibracion_l_ha) d.cal = b.calibracion_l_ha; }
  else if (k === 'sprayer_id') { var spAnt = byId(S.cat.sprayers, d.sprayer_id), spNu = byId(S.cat.sprayers, el.value); if (spNu && spNu.capacidad_l && (!d.agua || (spAnt && String(d.agua) === String(spAnt.capacidad_l)))) d.agua = spNu.capacidad_l; d.sprayer_id = el.value; var bb = byId(S.cat.boquillas, d.boquilla_id); if (bb && bb.sprayer_id && String(bb.sprayer_id) !== String(d.sprayer_id)) d.boquilla_id = ''; }
  else d[k] = el.value;
  renderNueva();
});
document.addEventListener('submit', function (e) {
  var f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault(); enviarForm(f);
});

init();
})();
</script>
