<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero · SMGC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d2e20">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Pantalla de televisión: escenario fijo de 1920x1080 que se escala a cualquier TV. Fondo verde institucional oscuro para leerse de lejos. */
:root{
  --bg:#0b2a1d; --panel:#12382a; --panel-2:#174532; --line:rgba(255,255,255,.12);
  --ink:#f4f7f5; --muted:#a9bdb1; --gold:#d8b864; --gold-soft:rgba(216,184,100,.16);
  --ok:#7fd3a4; --warn:#f0b866;
  --f-display:"Marcellus",Georgia,serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--f-body)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-rows:118px 1fr 74px;padding:28px 40px 22px;gap:22px}

header{display:flex;align-items:center;gap:26px}
header img{height:96px;width:96px;object-fit:contain;background:#fff;border-radius:16px;padding:8px}
.ttl .k{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.ttl h1{font-family:var(--f-display);font-weight:400;font-size:54px;margin:2px 0 0;line-height:1}
.clock{margin-left:auto;text-align:right}
.clock .t{font-family:var(--f-mono);font-size:84px;font-weight:600;line-height:.95;letter-spacing:-.02em}
.clock .d{font-size:26px;color:var(--muted);margin-top:4px}

main{display:grid;grid-template-columns:1fr 500px;gap:26px;min-height:0}
.sec{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:12px}
.sec .n{font-family:var(--f-mono);letter-spacing:0;color:var(--gold)}
.now{min-height:0;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:18px;flex:1;min-height:0}
.grid.pocos{grid-auto-rows:auto;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.card .top{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--c)}
.card .lt{font-family:var(--f-mono);font-weight:600;font-size:30px;background:rgba(0,0,0,.25);border-radius:10px;min-width:62px;text-align:center;padding:2px 10px}
.card .pn{font-size:30px;font-weight:800;line-height:1.1}
.card .ppl{padding:12px 16px 4px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.card.muchos .ins{display:none}
.grid:not(.pocos) .card.dos .ins{display:none}
.p{display:flex;align-items:baseline;gap:8px;min-width:0}
.p b{font-size:31px;font-weight:700;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p span{font-family:var(--f-mono);font-size:19px;color:var(--muted);white-space:nowrap;flex:none}
.p.lunch b{color:var(--muted)} .p.lunch span{color:var(--warn)}
.card .ins{padding:6px 18px 14px;font-size:21px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.lleno .ins{display:none}

aside{display:grid;grid-template-rows:auto 1fr;gap:22px;min-height:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-height:0;overflow:hidden}
.row{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .h{font-family:var(--f-mono);font-size:30px;font-weight:600}
.row .w b{display:block;font-size:30px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w{min-width:0}
.row .w em{display:block;font-style:normal;font-size:21px;line-height:1.35;color:var(--ink);opacity:.85;margin-top:4px}
.row .w small{font-size:22px;color:var(--muted)}
.row .w small i{font-style:normal;font-family:var(--f-mono);font-weight:600;color:var(--ink);background:var(--c);border-radius:6px;padding:0 8px;margin-right:8px}
.row.ya .h{color:var(--gold)} .row.ya{background:var(--gold-soft);margin:0 -22px;padding:10px 22px;border-top-color:transparent}
.empty{font-size:26px;color:var(--muted);padding:8px 0}
.fin{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:30px}
.fin b{display:block;font-family:var(--f-display);font-weight:400;font-size:60px;color:var(--ink);margin-bottom:10px}
.mas{font-size:22px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.lunchbox .row .h{font-size:26px}

footer{display:flex;align-items:center;gap:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 24px;font-size:24px;overflow:hidden;white-space:nowrap}
footer b{color:var(--gold);font-weight:700;margin-right:8px;letter-spacing:.08em;text-transform:uppercase;font-size:20px}
footer .grp{overflow:hidden;text-overflow:ellipsis}
footer .upd{margin-left:auto;font-family:var(--f-mono);font-size:20px;color:var(--muted);flex:none}
footer .upd.off{color:var(--warn)}

.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:40px;color:var(--muted)}
.msg b{display:block;font-family:var(--f-display);font-weight:400;font-size:64px;color:var(--ink);margin-bottom:14px}
</style>
</head>
<body>
<div id="stage">
  <header>
    <img src="../logo.png" alt="Santa María Golf Club">
    <div class="ttl"><div class="k">Santa María Golf Club</div><h1>Operación de golf</h1></div>
    <div class="clock"><div class="t" id="hora">--:--</div><div class="d" id="fecha"></div></div>
  </header>
  <main>
    <section class="now"><h2 class="sec" id="nowTitle">En este momento</h2><div class="grid" id="grid"></div></section>
    <aside>
      <div class="box"><h2 class="sec">Almuerzos</h2><div id="lunch" class="lunchbox"></div></div>
      <div class="box"><h2 class="sec" id="nextTitle">Próximas entradas</h2><div id="next"></div></div>
    </aside>
  </main>
  <footer><div class="grp" id="libres"></div><div class="upd" id="upd"></div></footer>
  <div class="msg" id="msg" hidden></div>
</div>
<script>
var SB_URL = "https://kqupzmmudvegropbtbwu.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxdXB6bW11ZHZlZ3JvcGJ0Ynd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTQ0NjksImV4cCI6MjEwNzY3MDQ2OX0.o-2D4npIhzS9L2cuuFFmrdLmXFeUQi8jnd0wPD5niXg";
var KEY = new URLSearchParams(location.search).get("k") || "";
var D = null, OFFSET = 0, MANANA = null, lastOk = 0;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function min(t){ if (!t) return null; var a = t.split(":"); return +a[0] * 60 + +a[1]; }
function h12(t){ var m = min(t), h = Math.floor(m / 60), mm = m % 60; return ((h + 11) % 12 + 1) + ":" + (mm < 10 ? "0" : "") + mm + (h < 12 ? " a. m." : " p. m."); }
function hc(t){ var m = min(t), h = Math.floor(m / 60), mm = m % 60; return ((h + 11) % 12 + 1) + (mm ? ":" + (mm < 10 ? "0" : "") + mm : "") + (h < 12 ? " am" : " pm"); }
function ahora(){ return new Date(Date.now() + OFFSET); }   // hora de Panamá según el servidor, aunque el reloj de la TV esté mal
function minAhora(){ var d = ahora(); return d.getUTCHours() * 60 + d.getUTCMinutes(); }
function corto(n){ var p = String(n).split(" "); return p.length > 2 ? p[0] + " " + p[1] : n; }

function fit(){ var s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $("stage");
  st.style.transform = "scale(" + s + ")"; st.style.left = ((innerWidth - 1920 * s) / 2) + "px"; st.style.top = ((innerHeight - 1080 * s) / 2) + "px"; }
addEventListener("resize", fit); fit();

function rpc(fecha){
  return fetch(SB_URL + "/rest/v1/rpc/tablero_dia", {method:"POST", headers:{"apikey":SB_KEY, "Authorization":"Bearer " + SB_KEY, "Content-Type":"application/json"},
    body: JSON.stringify(fecha ? {p_token:KEY, p_fecha:fecha} : {p_token:KEY})})
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.message || "Error"); return j; }); });
}
function mensaje(t, s){ $("msg").innerHTML = "<div><b>" + esc(t) + "</b>" + esc(s) + "</div>"; $("msg").hidden = false; }

function cargar(){
  if (!KEY) { mensaje("Falta el enlace del tablero", "Abra el enlace completo que aparece en la app, pestaña Horario."); return; }
  rpc().then(function(j){
    D = j; lastOk = Date.now(); $("msg").hidden = true;
    OFFSET = new Date(j.ahora + "Z").getTime() - Date.now();
    var quedan = j.turnos.some(function(t){ return t.tipo === "trabajo" && min(t.fin) > minAhora(); });
    if (!quedan) { var f = new Date(j.fecha + "T12:00:00Z"); f.setUTCDate(f.getUTCDate() + 1);
      return rpc(f.toISOString().slice(0, 10)).then(function(m){ MANANA = m; pintar(); }); }
    MANANA = null; pintar();
  }).catch(function(e){
    if (!D) mensaje(/no válido/i.test(e.message) ? "Enlace no válido" : "Sin conexión", /no válido/i.test(e.message) ? "Pida en la app el enlace actual del tablero." : "Reintentando…");
    pintarEstado();
  });
}

function reloj(){
  var d = ahora();
  $("hora").textContent = h12((d.getUTCHours() < 10 ? "0" : "") + d.getUTCHours() + ":" + (d.getUTCMinutes() < 10 ? "0" : "") + d.getUTCMinutes()).replace(/ (a|p)\. m\./, "");
  var f = d.toLocaleDateString("es-PA", {weekday:"long", day:"numeric", month:"long", timeZone:"UTC"});
  $("fecha").textContent = f.charAt(0).toUpperCase() + f.slice(1) + (d.getUTCHours() < 12 ? " · a. m." : " · p. m.");
}

function pintarEstado(){
  var u = $("upd"), seg = Math.round((Date.now() - lastOk) / 1000);
  if (!lastOk) { u.textContent = ""; return; }
  u.className = "upd" + (seg > 180 ? " off" : "");
  u.textContent = seg > 180 ? "Sin conexión desde " + Math.round(seg / 60) + " min" : "Actualizado " + h12(new Date(lastOk + OFFSET).toISOString().slice(11, 16));
}

function pintar(){
  if (!D) return;
  var m = minAhora(), P = {}, orden = {};
  D.puestos.forEach(function(p, i){ P[p.codigo] = p; orden[p.codigo] = i; });
  var trab = D.turnos.filter(function(t){ return t.tipo === "trabajo"; });

  // En este momento: agrupado por puesto
  var activos = trab.filter(function(t){ return min(t.inicio) <= m && m < min(t.fin); });
  var porPuesto = {};
  activos.forEach(function(t){ (porPuesto[t.puesto] = porPuesto[t.puesto] || []).push(t); });
  var codigos = Object.keys(porPuesto).sort(function(a, b){ return orden[a] - orden[b]; });
  $("nowTitle").innerHTML = "En este momento <span class='n'>" + activos.length + "</span>";
  $("grid").className = "grid" + (codigos.length <= 6 ? " pocos" : "") + (codigos.length > 9 ? " lleno" : "");
  $("grid").innerHTML = codigos.length ? codigos.map(function(c){
    var p = P[c] || {nombre:c, color:"#4a5a66", instrucciones:""};
    return "<div class='card" + (porPuesto[c].length > 2 ? " muchos" : porPuesto[c].length > 1 ? " dos" : "") + "' style='--c:" + esc(p.color) + "'><div class='top'><span class='lt'>" + esc(c) + "</span><span class='pn'>" + esc(p.nombre) + "</span></div>" +
      "<div class='ppl'>" + porPuesto[c].map(function(t){
        var enAlm = t.almuerzo_inicio && min(t.almuerzo_inicio) <= m && m < min(t.almuerzo_fin);
        return "<div class='p" + (enAlm ? " lunch" : "") + "'><b>" + esc(corto(t.persona)) + "</b><span>" + (enAlm ? "almuerzo · " + hc(t.almuerzo_fin) : "hasta " + hc(t.fin)) + "</span></div>";
      }).join("") + "</div>" + (p.instrucciones ? "<div class='ins'>" + esc(p.instrucciones) + "</div>" : "") + "</div>";
  }).join("") : (MANANA && MANANA.turnos.some(function(t){ return t.tipo === "trabajo"; })
      ? (function(){ var w = MANANA.turnos.filter(function(t){ return t.tipo === "trabajo"; }), pr = Math.min.apply(null, w.map(function(t){ return min(t.inicio); })),
          n = w.filter(function(t){ return min(t.inicio) === pr; }).length;
          return "<div class='fin'><b>Fin de la jornada</b>Mañana a las " + h12(String(Math.floor(pr / 60)).padStart(2, "0") + ":" + String(pr % 60).padStart(2, "0")) + " entran " + n + (n === 1 ? " persona." : " personas.") + "</div>"; })()
      : "<div class='fin'><b>Sin personal en turno</b>No hay turnos cargados para este momento.</div>");

  // Próximas entradas (o las de mañana cuando el día terminó)
  var fuente = MANANA ? MANANA.turnos.filter(function(t){ return t.tipo === "trabajo"; }) : trab, PM = {};
  (MANANA ? MANANA.puestos : D.puestos).forEach(function(p){ PM[p.codigo] = p; });
  var prox = fuente.filter(function(t){ var i = min(t.inicio); return MANANA ? true : (i > m - 15 && i <= m + 240 && !(i <= m - 15)); })
    .sort(function(a, b){ return min(a.inicio) - min(b.inicio); });
  var extra = Math.max(0, prox.length - 6); prox = prox.slice(0, 6);
  $("nextTitle").textContent = MANANA ? "Mañana entran" : "Próximas entradas";
  $("next").innerHTML = prox.length ? prox.map(function(t){
    var p = PM[t.puesto] || {nombre:t.puesto, color:"#4a5a66"}, i = min(t.inicio), ya = !MANANA && i <= m;
    return "<div class='row" + (ya ? " ya" : "") + "'><div class='h'>" + h12(t.inicio).replace(/ (a|p)\. m\./, "") + "</div><div class='w'><b>" + esc(corto(t.persona)) + "</b>" +
      "<small><i style='--c:" + esc(p.color) + "'>" + esc(t.puesto) + "</i>" + esc(p.nombre) + (ya ? " · entra ahora" : "") + " · hasta " + hc(t.fin) + "</small>" +
      (ya && p.instrucciones ? "<em>" + esc(p.instrucciones) + "</em>" : "") + "</div></div>";
  }).join("") + (extra ? "<div class='mas'>y " + extra + " más</div>" : "") : "<div class='empty'>No hay más entradas hoy.</div>";

  // Almuerzos: los que están o los próximos
  var alm = trab.filter(function(t){ return t.almuerzo_inicio && min(t.almuerzo_fin) > m && min(t.almuerzo_inicio) - m <= 180; });
  var grupos = {};
  alm.forEach(function(t){ var k = t.almuerzo_inicio + "-" + t.almuerzo_fin; (grupos[k] = grupos[k] || []).push(corto(t.persona)); });
  var ks = Object.keys(grupos).sort();
  $("lunch").innerHTML = ks.length ? ks.map(function(k){ var a = k.split("-"), en = min(a[0]) <= m;
    return "<div class='row" + (en ? " ya" : "") + "'><div class='h'>" + h12(a[0]).replace(/ (a|p)\. m\./, "") + "</div><div class='w'><small>" + (en ? "En almuerzo hasta " + hc(a[1]) : "hasta " + hc(a[1])) + "</small><b style='font-size:22px;font-weight:600;white-space:normal;line-height:1.3'>" + esc(grupos[k].join(", ")) + "</b></div></div>"; }).join("")
    : "<div class='empty'>Sin almuerzos en las próximas horas.</div>";

  // Pie: libres hoy
  var lib = {descanso:[], vacaciones:[], compensatorio:[]};
  D.turnos.forEach(function(t){ if (lib[t.tipo]) lib[t.tipo].push(corto(t.persona)); });
  $("libres").innerHTML = [["descanso","Descanso"],["vacaciones","Vacaciones"],["compensatorio","Compensatorio"]].filter(function(x){ return lib[x[0]].length; })
    .map(function(x){ return "<span style='margin-right:34px'><b>" + x[1] + "</b>" + esc(lib[x[0]].join(", ")) + "</span>"; }).join("");
  pintarEstado();
}

reloj(); cargar();
setInterval(function(){ reloj(); pintar(); }, 15000);
setInterval(reloj, 1000);
setInterval(cargar, 30000);
setTimeout(function(){ location.reload(); }, 6 * 3600 * 1000);   // recarga la página cada 6 horas para traer la versión más reciente
</script>
</body>
</html>
